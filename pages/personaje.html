<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina el Personaje · Biblia Games</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/games.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-particles"></div>

  <div class="game-container">
    <div class="game-header glass">
      <a href="../index.html" class="icon-btn"><span class="material-icons">arrow_back</span></a>
      <h2>👤 Adivina el Personaje</h2>
      <div class="header-actions">
        <button id="resetBtn" class="btn"><span class="material-icons">refresh</span>Reiniciar</button>
      </div>
    </div>

    <div class="panel glass">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div style="text-align:center; margin-bottom:8px; color:var(--text-muted);">
        Pregunta <strong id="qNum">1</strong> / <span id="qTotal">5</span> · Puntos: <strong id="score">0</strong>
      </div>
      <p class="question" id="question">Pista 1</p>
      <div class="hint-box" id="hintBox">💡 Pista adicional</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div style="text-align:center; margin-top:16px;">
        <button id="nextBtn" class="btn primary" style="display:none;">
          Siguiente <span class="material-icons">arrow_forward</span>
        </button>
      </div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/personaje.js"></script>
</body>
</html>
