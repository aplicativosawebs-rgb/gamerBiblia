<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdadero o Falso · Biblia Games</title>
  <link rel="icon" href="../asset/favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/games.css">
  <!-- En la sección <head> de tu página de juego -->
  <link rel="stylesheet" href="../css/instrucciones-modal.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
  <div class="bg-gradient"></div>
  <div class="bg-particles"></div>

  <div class="game-container">
    <div class="game-header glass">
      <a href="../index.html" class="icon-btn"><span class="material-icons">arrow_back</span></a>
      <h2>✔️❌ Verdadero o Falso</h2>

      <div class="header-actions">
        <button id="resetBtn" class="btn"><span class="material-icons">refresh</span>Reiniciar</button>
        <button id="themeToggle" class="icon-btn glass" title="Modo claro/oscuro">
          <span class="material-icons">dark_mode</span>
        </button>
        <!-- Botón para abrir instrucciones -->
        <button id="btn-instrucciones" class="btn secondary" style="margin-bottom: 16px;">
          <span class="material-icons">help_outline</span>
          Ayuda
        </button>
      </div>
    </div>

    <div class="panel glass">
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div style="text-align:center; margin-bottom:8px;">
        Pregunta <strong id="qNum">1</strong> / <span id="qTotal">10</span> · Puntos: <strong id="score">0</strong> ·
        Correctas: <strong id="correct">0</strong>
      </div>

      <div class="question-box" id="questionBox">
        <p class="question" id="question">Afirmación</p>
      </div>

      <div class="tf-options">
        <button class="btn tf-btn verdadero" id="verdaderoBtn">
          <span class="material-icons">check_circle</span>
          VERDADERO
        </button>
        <button class="btn tf-btn falso" id="falsoBtn">
          <span class="material-icons">cancel</span>
          FALSO
        </button>
      </div>

      <div class="feedback" id="feedback"></div>

      <div style="text-align:center; margin-top:16px;">
        <button id="nextBtn" class="btn primary" style="display:none;">
          Siguiente <span class="material-icons">arrow_forward</span>
        </button>
      </div>
    </div>
  </div>

  <style>
    .question-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      border-left: 4px solid var(--primary);
      text-align: center;
    }

    .tf-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .tf-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .tf-btn.verdadero {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .tf-btn.falso {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }

    .tf-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .tf-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .tf-btn.selected {
      border-color: white;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    @media (max-width: 600px) {
      .tf-options {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <!-- Modal de Instrucciones -->
  <div id="modal-instrucciones" class="modal-instrucciones">
    <div class="modal-instrucciones-content">
      <div class="modal-header-close">
        <button id="cerrar-modal" title="Cerrar">
          <span class="material-icons">close</span>
        </button>
      </div>
      <div id="modal-content"></div>
    </div>
  </div>


  <script src="../js/storage.js"></script>
  <script src="../js/verdadero-falso.js"></script>
  <script src="../js/app.js"></script>
  <!-- Al final del body, después de todos los scripts del juego -->
  <script src="../js/instrucciones-modal.js"></script>
</body>

</html>
