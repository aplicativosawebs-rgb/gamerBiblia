<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Código Secreto · Biblia Games</title>
  <link rel="icon" href="../asset/favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/games.css">
  <!-- En la sección <head> de tu página de juego -->
  <link rel="stylesheet" href="../css/instrucciones-modal.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-particles"></div>

  <div class="game-container">
    <div class="game-header glass">
      <a href="../index.html" class="icon-btn"><span class="material-icons">arrow_back</span></a>
      <h2>🔐 El Código Secreto</h2>
      <div class="header-actions">
        <button id="resetBtn" class="btn"><span class="material-icons">refresh</span>Reiniciar</button>
         <button id="themeToggle" class="icon-btn glass" title="Modo claro/oscuro">
                <span class="material-icons">dark_mode</span>
            </button>
        <button id="btn-instrucciones" class="btn secondary" style="margin-bottom: 16px;">
          <span class="material-icons">help_outline</span>
          Ayuda
        </button>
      </div>
    </div>

    <div class="panel glass">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div style="text-align:center;color:var(--text-muted);margin-bottom:12px;">
        Enigma <strong id="enigmaNum">1</strong>/3 · Puntos: <strong id="score">0</strong>
      </div>

      <p class="question" id="question"></p>
      <div class="hint-box" id="hint"></div>

      <p style="text-align:center;margin:16px 0 10px;font-weight:600;">
        🔎 ¿Cuál referencia corresponde al enigma?
      </p>
      <div class="options" id="options"></div>

      <div class="feedback" id="feedback"></div>

      <div style="text-align:center;margin-top:16px;">
        <button id="nextBtn" class="btn primary" style="display:none;">
          Siguiente <span class="material-icons">arrow_forward</span>
        </button>
      </div>
    </div>
  </div>
<!-- Modal de Instrucciones -->
  <div id="modal-instrucciones" class="modal-instrucciones">
    <div class="modal-instrucciones-content">
      <div class="modal-header-close">
        <button id="cerrar-modal" title="Cerrar">
          <span class="material-icons">close</span>
        </button>
      </div>
      <div id="modal-content"></div>
    </div>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/codigo-secreto.js"></script>
  <script src="../js/app.js"></script>
  <!-- Al final del body, después de todos los scripts del juego -->
  <script src="../js/instrucciones-modal.js"></script>
</body>
</html>
