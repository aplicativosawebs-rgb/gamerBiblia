<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Código Secreto · Biblia Games</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/games.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-particles"></div>

  <div class="game-container">
    <div class="game-header glass">
      <a href="../index.html" class="icon-btn"><span class="material-icons">arrow_back</span></a>
      <h2>🔐 El Código Secreto</h2>
      <div class="header-actions">
        <button id="resetBtn" class="btn"><span class="material-icons">refresh</span>Reiniciar</button>
      </div>
    </div>

    <div class="panel glass">
      <div style="text-align:center;color:var(--text-muted);margin-bottom:12px;">
        Enigma <strong id="enigmaNum">1</strong>/3 · Puntos: <strong id="score">0</strong>
      </div>
      <p class="question" id="question"></p>
      <div class="hint-box" id="hint"></div>

      <p style="text-align:center;margin:16px 0 8px;font-weight:600;">Elige la referencia correcta:</p>
      <div class="options" id="options"></div>

      <div class="code-lock" id="codeLock" style="display:none;">
        <div class="code-slot" data-part="book">📖 Libro</div>
        <div class="code-slot" data-part="chapter"># Capítulo</div>
        <div class="code-slot" data-part="verse">: Versículo</div>
      </div>

      <div class="feedback" id="feedback"></div>
      <div style="text-align:center;margin-top:16px;">
        <button id="nextBtn" class="btn primary" style="display:none;">Siguiente <span class="material-icons">arrow_forward</span></button>
      </div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/codigo-secreto.js"></script>
</body>
</html>
