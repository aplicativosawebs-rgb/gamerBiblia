<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Línea de Tiempo Bíblica · Biblia Games</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/games.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-particles"></div>

  <div class="game-container">
    <div class="game-header glass">
      <a href="../index.html" class="icon-btn"><span class="material-icons">arrow_back</span></a>
      <h2>⏳ Línea de Tiempo Bíblica</h2>
      <div class="header-actions">
        <button id="resetBtn" class="btn"><span class="material-icons">refresh</span>Reiniciar</button>
      </div>
    </div>

    <div class="panel glass">
      <p class="question">Ordena los eventos entre el inicio y el final</p>
      <div style="text-align:center;color:var(--text-muted);margin-bottom:12px;">
        Ronda <strong id="round">1</strong>/3 · Puntos: <strong id="score">0</strong>
      </div>
      <div class="timeline-list" id="list"></div>
      <div style="text-align:center;margin-top:16px;">
        <button id="checkBtn" class="btn primary"><span class="material-icons">check_circle</span>Comprobar orden</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/timeline.js"></script>
</body>
</html>
