<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semáforo Bíblico · Biblia Games</title>
  <link rel="icon" href="../asset/favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/instrucciones-modal.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-particles"></div>

  <div class="game-container">
    <div class="game-header glass">
      <a href="../index.html" class="icon-btn"><span class="material-icons">arrow_back</span></a>
      <h2>🚦 Semáforo Bíblico</h2>
      
      <div class="header-actions">
        <button id="resetBtn" class="btn"><span class="material-icons">refresh</span>Reiniciar</button>
        <button id="themeToggle" class="icon-btn glass" title="Modo claro/oscuro">
          <span class="material-icons">dark_mode</span>
        </button>
        <button id="btn-instrucciones" class="btn secondary" style="margin-bottom: 16px;">
          <span class="material-icons">help_outline</span>
          Ayuda
        </button>
      </div>
    </div>

    <div class="panel glass">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div style="text-align:center; margin-bottom:8px; color:var(--text-muted);">
        Pregunta <strong id="qNum">1</strong> / <span id="qTotal">5</span> · Puntos: <strong id="score">0</strong>
      </div>
      
      <div class="question-box" id="questionBox">
        <p class="question" id="question">Afirmación</p>
      </div>

      <div class="semaforo-options">
        <button class="btn semaforo-btn verde" id="verdeBtn">
          <span class="material-icons">check_circle</span>
          <div>VERDE</div>
          <div class="semaforo-label">Verdadero</div>
        </button>
        <button class="btn semaforo-btn amarillo" id="amarilloBtn">
          <span class="material-icons">help_center</span>
          <div>AMARILLO</div>
          <div class="semaforo-label">Depende</div>
        </button>
        <button class="btn semaforo-btn rojo" id="rojoBtn">
          <span class="material-icons">cancel</span>
          <div>ROJO</div>
          <div class="semaforo-label">Falso</div>
        </button>
      </div>

      <div class="feedback" id="feedback"></div>
      
      <div style="text-align:center; margin-top:16px;">
        <button id="nextBtn" class="btn primary" style="display:none;">
          Siguiente <span class="material-icons">arrow_forward</span>
        </button>
      </div>
    </div>
  </div>

  <style>
    .question-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      border-left: 4px solid var(--primary);
      text-align: center;
    }

    .semaforo-options {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .semaforo-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border: 3px solid transparent;
      transition: all 0.3s ease;
      color: white;
    }

    .semaforo-btn .material-icons {
      font-size: 2rem;
    }

    .semaforo-label {
      font-size: 0.75rem;
      opacity: 0.9;
      font-weight: 500;
    }

    .semaforo-btn.verde {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .semaforo-btn.amarillo {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
    }

    .semaforo-btn.amarillo .semaforo-label {
      color: #000;
    }

    .semaforo-btn.rojo {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    .semaforo-btn:hover:not(:disabled) {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .semaforo-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .semaforo-btn.selected {
      border-color: white;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .semaforo-options {
        grid-template-columns: 1fr;
      }

      .semaforo-btn {
        padding: 14px 10px;
      }

      .semaforo-btn .material-icons {
        font-size: 1.8rem;
      }

      .semaforo-btn div:first-of-type {
        font-size: 0.9rem;
      }
    }
  </style>
<!-- Modal de Instrucciones -->
  <div id="modal-instrucciones" class="modal-instrucciones">
    <div class="modal-instrucciones-content">
      <div class="modal-header-close">
        <button id="cerrar-modal" title="Cerrar">
          <span class="material-icons">close</span>
        </button>
      </div>
      <div id="modal-content"></div>
    </div>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/semaforo-biblico.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/instrucciones-modal.js"></script>
</body>
</html>
